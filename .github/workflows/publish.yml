name: Publish to npm and GitHub Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to publish (for example v0.1.2)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Use npm with trusted publishing support
        run: npm install --global npm@11
      - name: Install dependencies and build
        run: npm ci
      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          node -e 'const pkg = require("./package.json"); if (process.env.RELEASE_TAG !== "v" + pkg.version) throw new Error("Release tag must match package version")'
      - name: Verify version and pack plugin
        id: pack
        run: npm run pack:check
      - uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
      - name: Publish with npm trusted publishing
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
          DIST_TAG: ${{ steps.pack.outputs.dist-tag }}
        run: npm publish "./$TARBALL" --access public --tag "$DIST_TAG"

  release:
    name: Publish GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: npm-package
          path: package
      - name: Create release and upload npm package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(package/*.tgz)
          if [ "${#packages[@]}" -ne 1 ]; then
            echo "Expected exactly one npm package artifact" >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${packages[0]}" --clobber
          else
            release_options=(--verify-tag --title "$RELEASE_TAG" --generate-notes)
            if [[ "$RELEASE_TAG" == *-* ]]; then
              release_options+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" "${packages[0]}" "${release_options[@]}"
          fi
